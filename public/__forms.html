<!DOCTYPE html>
<html>
  <body>
    <!-- Static form skeleton for Netlify Forms build-time detection -->
    <form name="studio-contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="studio-contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
